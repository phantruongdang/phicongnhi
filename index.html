<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Phi Công Nhí</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Bố cục: một sân khấu canvas toàn màn hình, HUD nổi phía trên, bảng điều khiển phía dưới */
:root{--ink:#1f2a5a;--sun:#ffc93c;--coral:#ff5d6c;--sky:#4cc9f0;--mint:#2ec4a6;--paper:#fffdf7;
--font:'Baloo 2','Fredoka','Comic Sans MS','Trebuchet MS',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#7fd3ff;font-family:var(--font);color:var(--ink);user-select:none;-webkit-user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button,input,select{font-family:inherit}

.hud{position:fixed;left:0;right:0;top:0;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:10px 12px;pointer-events:none;z-index:5}
.hud .grp{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.93);border:3px solid var(--ink);border-radius:999px;padding:2px 14px;font-weight:800;font-size:clamp(15px,2.8vw,24px);box-shadow:0 4px 0 var(--ink);display:flex;align-items:center;gap:6px;white-space:nowrap}
.ibtn{pointer-events:auto;width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);background:#fff;font-size:22px;box-shadow:0 4px 0 var(--ink);cursor:pointer}
.ibtn:active,.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
#hearts .h{display:inline-block;font-size:1.1em}
#hearts .lost{filter:grayscale(1);opacity:.55}
#hearts .break{animation:shake .5s}

.bottom{position:fixed;left:0;right:0;bottom:max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:5;pointer-events:none;padding:0 12px}
.bottom>*{pointer-events:auto}
.heard{background:rgba(255,255,255,.93);border:3px solid var(--ink);border-radius:18px;padding:3px 14px;font-weight:700;font-size:clamp(14px,2.5vw,20px);max-width:92vw;text-align:center}
.timer{position:relative;width:min(560px,86vw);height:30px;border:3px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden;box-shadow:0 4px 0 var(--ink)}
.timer i{position:absolute;left:0;top:0;bottom:0;width:100%;background:var(--mint)}
.timer b{position:absolute;inset:0;display:grid;place-items:center;font-size:18px}
.timer.hurry{animation:shake .35s infinite}
.acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

.btn{font-weight:800;font-size:clamp(18px,3vw,26px);color:var(--ink);background:var(--sun);border:4px solid var(--ink);border-radius:20px;padding:8px 22px;box-shadow:0 6px 0 var(--ink);cursor:pointer}
.btn.small{font-size:clamp(15px,2.4vw,20px);padding:3px 16px;border-width:3px;box-shadow:0 4px 0 var(--ink)}
.btn.ok{background:var(--mint)}
.btn.alt{background:#fff}
.btn.coral{background:var(--coral);color:#fff}

#good,#banner{position:fixed;left:50%;top:36%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;opacity:0;z-index:15;font-weight:800;white-space:nowrap;
-webkit-text-stroke:9px var(--ink);paint-order:stroke fill;text-shadow:0 8px 0 rgba(31,42,90,.35)}
#good{font-size:clamp(54px,13vw,130px);letter-spacing:2px}
#banner{font-size:clamp(36px,9vw,90px);color:#fff;line-height:1.05}
#banner small{display:block;font-size:.42em;-webkit-text-stroke:5px var(--ink);color:var(--sun)}
#good.go{animation:pop 1.1s ease-out forwards}
#banner.go{animation:pop 2s ease-out forwards}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.2) rotate(-12deg);opacity:0}
22%{transform:translate(-50%,-50%) scale(1.25) rotate(4deg);opacity:1}
38%{transform:translate(-50%,-50%) scale(1) rotate(-2deg)}
80%{opacity:1}100%{transform:translate(-50%,-62%) scale(1.08);opacity:0}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px) rotate(-2deg)}75%{transform:translateX(4px) rotate(2deg)}}
#bNext{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:12}

.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:20;padding:14px;background:rgba(31,42,90,.38)}
.screen.show{display:flex}
.card{background:var(--paper);border:4px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink);padding:22px 26px;width:min(520px,100%);max-height:96vh;overflow:auto;text-align:center}
.card h1{margin:0;font-size:clamp(34px,7vw,52px);line-height:1}
.card h2{margin:0 0 6px;font-size:clamp(26px,5vw,38px)}
.card p{margin:8px 0;font-size:clamp(15px,2.6vw,19px);line-height:1.35}
.card .stack{display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:14px}
.card select,.card input[type=number],.card input[type=text],.card input:not([type]){font-size:17px;font-weight:700;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:12px;padding:5px 10px;min-width:0}
.note{font-size:14px!important;color:#4a5588}

.modal{width:min(900px,100%);text-align:left;user-select:text;-webkit-user-select:text}
.gen{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin:10px 0;font-weight:700}
.gen label,.lvhead label{display:flex;gap:6px;align-items:center}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tab{border:3px solid var(--ink);background:#fff;border-radius:12px;padding:2px 12px;font-weight:800;font-size:17px;cursor:pointer;color:var(--ink)}
.tab.on{background:var(--sun)}.tab.empty{opacity:.5}
.lvhead{display:flex;flex-wrap:wrap;gap:8px 18px;font-weight:700;margin:10px 0}
.row{display:grid;grid-template-columns:minmax(90px,1.2fr) minmax(90px,1fr) 52px auto auto;gap:8px;align-items:center;margin:6px 0}
.row .thumb{width:52px;height:52px;border:3px solid var(--ink);border-radius:12px;background:#fff;display:grid;place-items:center;font-size:30px;overflow:hidden}
.row .thumb img{width:100%;height:100%;object-fit:cover}
.row .upl{cursor:pointer;border:3px solid var(--ink);border-radius:12px;padding:5px 10px;font-weight:700;background:#e8f7ff;white-space:nowrap;font-size:15px}
.row .x{border:3px solid var(--ink);background:#ffe4e7;border-radius:12px;padding:5px 10px;font-size:17px;cursor:pointer}
.foot{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;align-items:center}
#sMsg{font-weight:700;color:#c0243a}
@media(max-width:560px){.row{grid-template-columns:1fr 1fr 52px}.row .upl,.row .x{grid-column:auto}}
@media(prefers-reduced-motion:reduce){.timer.hurry{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud" id="hud" hidden>
  <div class="grp"><div class="pill" id="lvl">Level 1</div><div class="pill" id="hearts"></div></div>
  <div class="pill" id="prog">Từ 1/5</div>
  <div class="grp"><button class="ibtn" id="bSound" title="Bật/tắt âm thanh">🔊</button><button class="ibtn" id="bHome" title="Về màn hình chính">🏠</button></div>
</div>

<div class="bottom" id="bottom" hidden>
  <div class="heard" id="heard">🎤 Hãy đọc to từ trên đám mây!</div>
  <div class="timer" id="timer"><i id="timerFill"></i><b id="timerTxt">10</b></div>
  <div class="acts">
    <button class="btn small alt" id="bListen">🔊 Nghe từ này</button>
    <button class="btn small ok" id="bOk" hidden>✔ Bé đã đọc đúng</button>
  </div>
</div>

<div id="good" aria-hidden="true"></div>
<div id="banner" aria-hidden="true"></div>
<button class="btn" id="bNext" hidden>Level tiếp ▶</button>

<div class="screen show" id="menu">
  <div class="card">
    <h1>✈️ Phi Công Nhí</h1>
    <p>Đọc to từ tiếng Anh trên đám mây để máy bay bay tiếp nhé. Có 3 mạng ở mỗi Level!</p>
    <div class="stack">
      <label style="font-weight:700">Chọn Level&nbsp;<select id="startLevel"></select></label>
      <button class="btn" id="bPlay">▶ Bắt đầu bay</button>
      <button class="btn small alt" id="bSettings">⚙ Cài đặt từ vựng và thời gian</button>
    </div>
    <p class="note" id="micNote"></p>
  </div>
</div>

<div class="screen" id="end">
  <div class="card">
    <h2 id="endTitle"></h2>
    <p id="endText"></p>
    <div class="stack"><button class="btn" id="endA"></button><button class="btn small alt" id="endB"></button></div>
  </div>
</div>

<div class="screen" id="settings">
  <div class="card modal">
    <h2>⚙ Cài đặt trò chơi</h2>
    <div class="gen">
      <label><input type="checkbox" id="sSound"> Âm thanh</label>
      <label><input type="checkbox" id="sConfirm"> Luôn hiện nút ✔ cho bố mẹ xác nhận</label>
      <label>Độ chấm phát âm
        <select id="sStrict"><option value="easy">Dễ</option><option value="normal">Vừa</option><option value="hard">Chặt</option></select></label>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="lvhead">
      <label>Chủ đề <input type="text" id="lName" maxlength="40" placeholder="Ví dụ: Animals"></label>
      <label>Thời gian tối đa mỗi từ <input type="number" id="lTime" min="3" max="120" style="width:84px"> giây</label>
    </div>
    <div id="rows"></div>
    <div class="foot"><button class="btn small" id="bAdd">+ Thêm từ</button><span class="note" style="margin:0">Level không có từ nào sẽ được bỏ qua.</span></div>
    <div class="foot">
      <button class="btn ok" id="bSave">💾 Lưu và đóng</button>
      <button class="btn small alt" id="bExport">⬇ Xuất file</button>
      <button class="btn small alt" id="bImport">⬆ Nhập file</button>
      <button class="btn small alt" id="bReset">↺ Khôi phục mặc định</button>
      <button class="btn small alt" id="bCancel">Hủy</button>
      <input type="file" id="fImport" accept=".json,application/json" hidden>
    </div>
    <div id="sMsg"></div>
  </div>
</div>

<script>
'use strict';
(function(){
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const STORE='phicongnhi.v1';
const FONT='"Baloo 2","Fredoka","Comic Sans MS","Trebuchet MS",system-ui,sans-serif';
const EMOJI='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const INK='#1f2a5a';

/* ===== Cấu hình mặc định: 10 level, mỗi level có chủ đề, thời gian và danh sách từ + hình (emoji hoặc link/ảnh tải lên) ===== */
const DEFAULT_LEVELS=[
 ['Colors',25,[['red','🔴'],['blue','🔵'],['yellow','🟡'],['green','🟢'],['orange','🟠']]],
 ['Animals',22,[['cat','🐱'],['dog','🐶'],['bird','🐦'],['fish','🐟'],['duck','🦆']]],
 ['School things',20,[['book','📖'],['pen','🖊️'],['ruler','📏'],['bag','🎒'],['pencil','✏️']]],
 ['Fruit',18,[['apple','🍎'],['banana','🍌'],['grape','🍇'],['mango','🥭'],['lemon','🍋']]],
 ['Family',16,[['mother','👩'],['father','👨'],['sister','👧'],['brother','👦'],['baby','👶']]],
 ['My body',15,[['eye','👁️'],['nose','👃'],['mouth','👄'],['ear','👂'],['hand','✋']]],
 ['Toys',14,[['ball','⚽'],['robot','🤖'],['car','🚗'],['train','🚂'],['kite','🪁']]],
 ['Food',12,[['milk','🥛'],['bread','🍞'],['egg','🥚'],['rice','🍚'],['cake','🎂']]],
 ['Weather',10,[['sun','☀️'],['rain','🌧️'],['tree','🌳'],['flower','🌸'],['moon','🌙']]],
 ['Places',10,[['house','🏠'],['school','🏫'],['bus','🚌'],['hospital','🏥'],['shop','🏪']]]
];
function defaults(){
  return {sound:true,confirm:false,strict:'normal',
    levels:DEFAULT_LEVELS.map(([name,time,ws])=>({name,time,words:ws.map(([w,img])=>({w,img}))}))};
}
function sanitize(o){
  const d=defaults();
  if(!o||typeof o!=='object') return d;
  const out={sound:o.sound!==false,confirm:!!o.confirm,
    strict:['easy','normal','hard'].includes(o.strict)?o.strict:'normal',levels:[]};
  if(!Array.isArray(o.levels)){out.levels=d.levels;return out;}
  for(let i=0;i<10;i++){
    const L=o.levels[i]||{};
    const words=(Array.isArray(L.words)?L.words:[]).map(x=>({
      w:String((x&&x.w)||'').trim().slice(0,40),
      img:String((x&&x.img)||'').slice(0,400000)})).filter(x=>x.w).slice(0,30);
    out.levels.push({name:String(L.name||'').slice(0,40),time:clamp(Math.round(Number(L.time))||15,3,120),words});
  }
  return out;
}
function loadCfg(){
  try{const s=localStorage.getItem(STORE); if(s) return sanitize(JSON.parse(s));}catch(e){}
  return defaults();
}
function saveCfg(){
  try{localStorage.setItem(STORE,JSON.stringify(cfg));return true;}catch(e){return false;}
}
let cfg=loadCfg();
let soundOn=cfg.sound;

/* ===== Âm thanh tổng hợp bằng WebAudio (không cần file âm thanh) ===== */
let AC=null,master=null,noiseBuf=null;
function initAudio(){
  try{
    if(AC){if(AC.state==='suspended')AC.resume();return;}
    const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    AC=new C(); master=AC.createGain(); master.gain.value=.85; master.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
    const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  }catch(e){AC=null;}
}
function tone(f,t0,dur,type,vol,slide){
  if(!AC||!soundOn) return;
  const t=AC.currentTime+t0,o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol||.25,t+.015);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+.05);
}
function noise(t0,dur,vol,f0,f1,type){
  if(!AC||!soundOn||!noiseBuf) return;
  const t=AC.currentTime+t0,s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=noiseBuf; s.loop=true; fl.type=type||'lowpass';
  fl.frequency.setValueAtTime(f0,t); fl.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(fl); fl.connect(g); g.connect(master); s.start(t); s.stop(t+dur+.05);
}
const sfx={
  whoosh(){noise(0,.55,.16,300,1800,'bandpass');},
  good(){[660,880,1320,1760].forEach((f,i)=>tone(f,i*.07,.28,'triangle',.22));},
  boom(){
    noise(0,.7,.8,2200,60,'lowpass'); tone(130,0,.5,'sine',.7,35);
    tone(900,.25,.7,'sine',.2,180); tone(260,.95,.18,'triangle',.25,620); tone(620,1.1,.16,'triangle',.22,300);
  },
  lose(){tone(440,0,.25,'sawtooth',.14,330);tone(330,.25,.4,'sawtooth',.14,200);},
  tick(){tone(1100,0,.07,'square',.09);},
  launch(){tone(380,0,.55,'sine',.09,1700);},
  bang(){noise(0,.55,.5,3200,250,'lowpass');tone(rnd(90,160),0,.4,'sine',.4,40);
    for(let i=0;i<7;i++) noise(.08+i*.06+Math.random()*.05,.05,.25,5000,3000,'highpass');},
  fanfare(){
    const n=[523,659,784,1047,784,1047,1319];
    n.forEach((f,i)=>{tone(f,i*.13,.26,'square',.12);tone(f/2,i*.13,.26,'triangle',.18);});
    [523,659,784,1047].forEach(f=>tone(f,n.length*.13,.9,'triangle',.18));
  },
  start(){tone(330,0,.12,'triangle',.2);tone(494,.1,.12,'triangle',.2);tone(660,.2,.25,'triangle',.22);}
};

/* ===== Đọc to bằng giọng máy (Good job, nghe từ) ===== */
let voice=null,speaking=false,muteUntil=0;
function pickVoice(){
  try{
    const en=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));
    voice=en.find(v=>/(samantha|google us english|aria|jenny|zira|karen|natural|female)/i.test(v.name))||en.find(v=>/en[-_]US/i.test(v.lang))||en[0]||null;
  }catch(e){}
}
if('speechSynthesis' in window){pickVoice();try{speechSynthesis.onvoiceschanged=pickVoice;}catch(e){}}
function say(text,o){
  o=o||{};
  if(!('speechSynthesis' in window)||!soundOn) return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text); u.lang='en-US'; if(voice) u.voice=voice;
    u.rate=o.rate||.95; u.pitch=o.pitch||1.25; u.volume=1;
    let done=false;
    const fin=()=>{if(done)return;done=true;speaking=false;muteUntil=performance.now()+700;resumeRecSoon();};
    u.onend=fin; u.onerror=fin; setTimeout(fin,3800);
    speaking=true; pauseRec(); speechSynthesis.speak(u);
  }catch(e){speaking=false;}
}

/* ===== So khớp phát âm "tương đối" ===== */
const norm=s=>String(s).toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
function lev(a,b){
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev=cur;
  }
  return prev[n];
}
/* khung phụ âm: bỏ nguyên âm, gộp các phụ âm nghe gần giống (b/p, d/t, g/k/c, f/v, s/z, m/n) */
function skel(s){
  s=s.replace(/ph/g,'f').replace(/[^a-z]/g,'');
  let o='';
  for(const ch of s){
    if('aeiouyhw'.includes(ch)) continue;
    let m=ch;
    if('bp'.includes(ch)) m='p'; else if('dt'.includes(ch)) m='t'; else if('gkcq'.includes(ch)) m='k';
    else if('fv'.includes(ch)) m='f'; else if('szx'.includes(ch)) m='s'; else if('mn'.includes(ch)) m='n';
    if(o[o.length-1]!==m) o+=m;
  }
  return o;
}
function wordMatch(h,t,strict){
  if(!h||!t) return false;
  if(h===t) return true;
  const sim=1-lev(h,t)/Math.max(h.length,t.length);
  if(strict==='hard') return sim>=.85;
  const a=skel(h),b=skel(t);
  if(strict==='easy') return sim>=.5||(!!a&&a===b);
  return sim>=.7||(!!a&&a===b&&Math.abs(h.length-t.length)<=1);
}
function isCorrect(list,target,strict){
  const t=norm(target),tc=t.replace(/ /g,''),multi=t.includes(' ');
  for(const raw of list){
    const h=norm(raw); if(!h) continue;
    const hc=h.replace(/ /g,'');
    if(hc===tc) return true;
    if(multi){ if(wordMatch(hc,tc,strict)) return true; }
    else for(const tok of h.split(' ')) if(wordMatch(tok,t,strict)) return true;
  }
  return false;
}

/* ===== Nhận diện giọng nói của trình duyệt (Chrome, Edge, Safari) ===== */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,recWanted=false,recActive=false,recFails=0,micBlocked=!SR,recTimer=0;
function setupRec(){
  if(!SR||rec) return;
  rec=new SR(); rec.lang='en-US'; rec.continuous=true; rec.interimResults=true; rec.maxAlternatives=5;
  rec.onstart=()=>{recActive=true;};
  rec.onresult=e=>{
    if(speaking||performance.now()<muteUntil) return;
    const heard=[];
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r=e.results[i];
      for(let j=0;j<r.length;j++) heard.push(r[j].transcript);
    }
    onHeard(heard);
  };
  rec.onerror=e=>{
    const c=e.error;
    if(c==='not-allowed'||c==='service-not-allowed'){micBlocked=true;recWanted=false;updateMicUI();}
    else if(c==='network'||c==='audio-capture'){if(++recFails>=3){micBlocked=true;updateMicUI();}}
  };
  rec.onend=()=>{recActive=false;if(recWanted&&!micBlocked) scheduleRec(300);};
}
function scheduleRec(ms){
  clearTimeout(recTimer);
  recTimer=setTimeout(()=>{
    if(recWanted&&!micBlocked&&!recActive&&!speaking&&rec){try{rec.start();}catch(e){}}
  },ms);
}
function startRec(){
  recWanted=true; if(!SR||micBlocked) return;
  setupRec(); if(!recActive){try{rec.start();}catch(e){}}
}
function stopRec(){
  recWanted=false; clearTimeout(recTimer);
  if(rec&&recActive){try{rec.abort();}catch(e){}}
}
function pauseRec(){if(rec&&recActive){try{rec.abort();}catch(e){}}}

function layout(){

let sClouds=[],sBalloons=[],sBirds=[];

const CIRC=[[-.30,.08,.24],[-.12,-.14,.30],[.14,-.10,.30],[.34,.08,.23],[-.02,.16,.30],[.20,.16,.22],[-.26,.2,.2]];
function blob(x,y,w,fill,ink,lw){

    for(const c of CIRC){ctx.beginPath();ctx.arc(x+c[0]*w,y+c[1]*w,c[2]*w,0,7);ctx.fill();ctx.stroke();}

  ctx.fillStyle=fill;

}
function drawSky(){
  const p=PAL[G.lv%10]||PAL[0], g=ctx.createLinearGradient(0,0,0,H);

function drawSun(){
  const r=Math.max(32,50*S), x=W*.84, y=Math.max(hudEl.hidden?0:hudEl.offsetHeight,50)+r*1.25;
  ctx.save(); ctx.translate(x,y);

  for(let i=0;i<12;i++){ctx.rotate(Math.PI/6);ctx.beginPath();ctx.moveTo(-r*.22,-r*1.05);ctx.lineTo(0,-r*1.55);ctx.lineTo(r*.22,-r*1.05);ctx.fill();}
  ctx.rotate(-clock*.15-0);
  ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fillStyle='#ffd23f';ctx.fill();
  ctx.lineWidth=4;ctx.strokeStyle=INK;ctx.stroke();
  const blink=(clock%4)>3.85?.15:1;
  ctx.fillStyle=INK;
  for(const sx of[-1,1]){ctx.beginPath();ctx.ellipse(sx*r*.36,-r*.12,r*.07,r*.1*blink,0,0,7);ctx.fill();}
  ctx.fillStyle='rgba(255,93,108,.45)';
  for(const sx of[-1,1]){ctx.beginPath();ctx.arc(sx*r*.55,r*.18,r*.12,0,7);ctx.fill();}

}
function drawRainbow(){
  const cx=W*.3+Math.sin(clock*.05)*18, cy=H*.95, R=Math.min(W*.48,H*.78), bw=R*.07;

function drawHills(){
  const p=PAL[G.lv%10]||PAL[0];

/* ===== Hình minh họa (emoji hoặc ảnh) ===== */
const isImgSrc=s=>/^(data:image|https?:|blob:|\.{0,2}\/)/i.test(s)||/\.(png|jpe?g|gif|webp|svg)$/i.test(s);
const imgCache=new Map();
function getImg(src){
  let im=imgCache.get(src);
  if(!im){im=new Image(); im.onload=()=>{im._ok=true;}; im.onerror=()=>{im._bad=true;}; im.src=src; imgCache.set(src,im);}
  return im;
}
function drawIcon(src,x,y,size){
  ctx.save(); ctx.textAlign='center'; ctx.textBaseline='middle';
  if(src&&isImgSrc(src)){
    const im=getImg(src);
    if(im._ok){
      const k=Math.min(size/im.naturalWidth,size/im.naturalHeight),w=im.naturalWidth*k,h=im.naturalHeight*k;
      ctx.drawImage(im,x-w/2,y-h/2,w,h);
    }else{ctx.font=`${size*.7}px ${EMOJI}`;ctx.fillText(im._bad?'🖼️':'⏳',x,y);}
  }else{ctx.font=`${size*.85}px ${EMOJI}`;ctx.fillText(src||'⭐',x,y+size*.04);}
  ctx.restore();
}
function fitText(txt,maxW,start){
  let s=start; ctx.font=`800 ${s}px ${FONT}`;
  while(s>14&&ctx.measureText(txt).width>maxW){s-=2;ctx.font=`800 ${s}px ${FONT}`;}
  return s;
}

/* ===== Máy bay hoạt hình (phi công nhí đội mũ, đeo kính, quàng khăn) ===== */
function face(mood,t,cx,cy){
  const blink=(t%3.2)>3.08?.15:1;
  ctx.fillStyle=INK; ctx.strokeStyle=INK; ctx.lineWidth=3; ctx.lineCap='round';
  if(mood==='dizzy'){
    for(const ex of[cx-5,cx+5]){ctx.beginPath();ctx.moveTo(ex-3,cy-3);ctx.lineTo(ex+3,cy+3);ctx.moveTo(ex+3,cy-3);ctx.lineTo(ex-3,cy+3);ctx.stroke();}
    ctx.beginPath();ctx.moveTo(cx-5,cy+8);ctx.quadraticCurveTo(cx-2,cy+4,cx,cy+8);ctx.quadraticCurveTo(cx+2,cy+12,cx+5,cy+8);ctx.stroke();
    return;
  }
  for(const ex of[cx-5,cx+5]){ctx.beginPath();ctx.ellipse(ex,cy,2.6,3.2*blink,0,0,7);ctx.fill();}
  ctx.fillStyle='rgba(255,93,108,.5)';
  for(const ex of[cx-10,cx+10]){ctx.beginPath();ctx.arc(ex,cy+6,3.4,0,7);ctx.fill();}
  ctx.fillStyle=INK;
  if(mood==='worried'){
    ctx.beginPath();ctx.ellipse(cx,cy+9,3,4,0,0,7);ctx.fill();
    ctx.fillStyle='#7fdcff';ctx.beginPath();ctx.moveTo(cx+12,cy-9);ctx.quadraticCurveTo(cx+16,cy-3,cx+12,cy-1);ctx.quadraticCurveTo(cx+8,cy-3,cx+12,cy-9);ctx.fill();
  }else if(mood==='cheer'){
    ctx.beginPath();ctx.moveTo(cx-6,cy+6);ctx.quadraticCurveTo(cx,cy+16,cx+6,cy+6);ctx.closePath();ctx.fill();
  }else{
    ctx.beginPath();ctx.arc(cx,cy+5,6,.12*Math.PI,.88*Math.PI);ctx.stroke();
  }
}
function drawPlane(x,y,sc,rot,t,mood,prop){

  ctx.save(); ctx.beginPath(); ctx.ellipse(0,0,98,40,0,0,7); ctx.clip();
  ctx.fillStyle='#ffc93c'; ctx.fillRect(-100,12,210,40);
  ctx.fillStyle='rgba(255,255,255,.4)'; ctx.beginPath(); ctx.ellipse(-12,-24,58,7,-.03,0,7); ctx.fill();
  ctx.restore();
  ctx.beginPath(); ctx.ellipse(0,0,98,40,0,0,7); ctx.stroke();
  // cánh

  ctx.strokeStyle='rgba(255,255,255,.8)'; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(14,24); ctx.lineTo(-26,54); ctx.stroke(); ctx.strokeStyle=INK; ctx.lineWidth=6;
  // kính buồng lái + phi công
  ctx.lineWidth=5; ctx.fillStyle='#dff6ff'; ctx.beginPath(); ctx.arc(24,-20,26,0,7); ctx.fill(); ctx.stroke();
  ctx.lineWidth=4; ctx.fillStyle='#ffd9b3'; ctx.beginPath(); ctx.arc(24,-18,16,0,7); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#8a4b2a'; ctx.beginPath(); ctx.arc(24,-18,16,Math.PI,Math.PI*2); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#9be7ff'; ctx.lineWidth=3;

  ctx.fillStyle=INK; ctx.beginPath(); ctx.ellipse(109,0,6,bl,0,0,7); ctx.fill();
  // bánh xe
  ctx.beginPath(); ctx.moveTo(40,36); ctx.lineTo(46,58); ctx.stroke();
  ctx.fillStyle='#3a3f5c'; ctx.beginPath(); ctx.arc(46,63,11,0,7); ctx.fill(); ctx.stroke();

function star5(x,y,R,r,rot){
  ctx.beginPath();
  for(let i=0;i<10;i++){const a=rot-Math.PI/2+i*Math.PI/5,k=i%2?r:R;ctx.lineTo(x+Math.cos(a)*k,y+Math.sin(a)*k);}

/* ===== Đám mây chướng ngại có chữ + hình ===== */
function drawCloud(t){

/* ===== Hạt hiệu ứng: khói, sao, pháo hoa, mảnh vỡ ===== */
const P=[];
function spawn(p){const q=Object.assign({x:0,y:0,vx:0,vy:0,g:0,life:1,size:6,color:'#fff',type:'dot',rot:0,vr:0,drag:0},p);q.max=q.life;P.push(q);}
function spiky(x,y,R,r,n,rot){
  ctx.beginPath();
  for(let i=0;i<n*2;i++){const a=rot+i*Math.PI/n,k=i%2?r:R;ctx.lineTo(x+Math.cos(a)*k,y+Math.sin(a)*k);}
  ctx.closePath();
}
function drawPart(kind,s){
  ctx.lineJoin='round'; ctx.lineWidth=5; ctx.strokeStyle=INK;
  if(kind==='wing'){ctx.fillStyle='#4cc9f0';ctx.beginPath();ctx.moveTo(-30,-30);ctx.lineTo(30,-30);ctx.lineTo(12,30);ctx.quadraticCurveTo(0,38,-14,30);ctx.closePath();ctx.fill();ctx.stroke();}
  else if(kind==='tail'){ctx.fillStyle='#ffc93c';ctx.beginPath();ctx.moveTo(-22,22);ctx.lineTo(-34,-24);ctx.lineTo(0,-22);ctx.lineTo(24,6);ctx.closePath();ctx.fill();ctx.stroke();}
  else if(kind==='wheel'){ctx.fillStyle='#3a3f5c';ctx.beginPath();ctx.arc(0,0,14,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,5,0,7);ctx.fill();}
  else if(kind==='prop'){ctx.fillStyle=INK;ctx.beginPath();ctx.ellipse(0,0,6,34,0,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(0,0,34,6,0,0,7);ctx.fill();}
  else if(kind==='body'){ctx.fillStyle='#ff5d6c';ctx.beginPath();ctx.ellipse(0,0,34,22,0,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='#ffc93c';ctx.fillRect(-20,6,40,8);}
  else if(kind==='goggle'){ctx.fillStyle='#9be7ff';ctx.beginPath();ctx.arc(0,0,12,0,7);ctx.fill();ctx.stroke();}
}
function updateParticles(dt){
  for(let i=P.length-1;i>=0;i--){
    const p=P[i]; p.life-=dt; if(p.life<=0){P.splice(i,1);continue;}
    p.vx*=Math.max(0,1-p.drag*dt); p.vy=p.vy*Math.max(0,1-p.drag*dt)+p.g*dt;
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.rot+=p.vr*dt;
  }
}
function drawParticles(sparks){
  for(const p of P){
    if((p.type==='spark')!==!!sparks) continue;
    const a=clamp(p.life/p.max,0,1);
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
    if(p.type==='spark'){
      ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=Math.min(1,a*1.6);
      ctx.strokeStyle=p.color; ctx.lineCap='round';
      ctx.lineWidth=p.size*3; ctx.globalAlpha*=.3; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-p.vx*.05,-p.vy*.05); ctx.stroke();
      ctx.globalAlpha=Math.min(1,a*1.6); ctx.lineWidth=p.size*1.3; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-p.vx*.05,-p.vy*.05); ctx.stroke();
    }else if(p.type==='puff'){
      ctx.globalAlpha=a*.85; ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(0,0,p.size*(1+(1-a)*1.4),0,7); ctx.fill();
    }else if(p.type==='star'){
      ctx.globalAlpha=Math.min(1,a*2); ctx.fillStyle=p.color; ctx.strokeStyle=INK; ctx.lineWidth=2.5; star5(0,0,p.size,p.size*.45,0); ctx.fill(); ctx.stroke();
    }else if(p.type==='conf'){
      ctx.globalAlpha=Math.min(1,a*3); ctx.fillStyle=p.color; ctx.fillRect(-p.size/2,-p.size/4,p.size,p.size/2);
    }else if(p.type==='part'){
      ctx.globalAlpha=Math.min(1,a*2); const s=p.size/30; ctx.scale(s,s); drawPart(p.kind);
    }else{
      ctx.globalAlpha=a; ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(0,0,p.size,0,7); ctx.fill();
    }
    ctx.restore();
  }
}

/* ===== Pháo hoa ===== */
const FW=[];
function launchRocket(){
  FW.push({x:rnd(W*.12,W*.88),y:H*.82,vy:-rnd(520,700)*Math.max(.65,H/700),ty:rnd(H*.13,H*.42),hue:Math.floor(rnd(0,360)),shape:pick(['peony','ring','heart','star','peony'])});
  sfx.launch();
}
function burst(f){
  const k=clamp(Math.min(W,H)/600,.65,1.4), hue=f.hue;
  const add=(vx,vy,h)=>spawn({type:'spark',x:f.x,y:f.y,vx:vx*k,vy:vy*k,g:150,drag:.9,life:rnd(1.1,1.7),size:rnd(2.5,4),color:`hsl(${h},100%,${Math.floor(rnd(55,72))}%)`});
  if(f.shape==='ring'){for(let i=0;i<54;i++){const a=i/54*Math.PI*2;add(Math.cos(a)*260,Math.sin(a)*260,hue);}}
  else if(f.shape==='heart'){for(let i=0;i<64;i++){const t=i/64*Math.PI*2;add(16*Math.pow(Math.sin(t),3)*14,-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*14,345);}}
  else if(f.shape==='star'){for(let i=0;i<60;i++){const a=i/60*Math.PI*2,sp=(Math.floor(i/6)%2?300:170);add(Math.cos(a)*sp,Math.sin(a)*sp,hue);}}
  else{for(let i=0;i<80;i++){const a=rnd(0,Math.PI*2),sp=rnd(60,330);add(Math.cos(a)*sp,Math.sin(a)*sp,(hue+Math.floor(rnd(-30,30))+360)%360);}}
  sfx.bang();
}
function updateFireworks(dt){
  if(G.fwOn){G.fwT-=dt; if(G.fwT<=0){launchRocket(); G.fwT=rnd(.25,.5);}}
  for(let i=FW.length-1;i>=0;i--){
    const f=FW[i]; f.y+=f.vy*dt; f.vy*=.985;
    spawn({type:'spark',x:f.x+rnd(-2,2),y:f.y,vx:rnd(-15,15),vy:rnd(20,60),g:0,life:.35,size:2.5,color:`hsl(${f.hue},100%,75%)`});
    if(f.y<=f.ty||f.vy>-60){burst(f);FW.splice(i,1);}
  }
}

/* ===== Máy bay nổ tung (vui nhộn): mảnh vỡ bay tứ tung, chữ BOOM, phi công nhảy dù chóng mặt ===== */
function rrect(x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function explode(){
  const x=PL.x+PL.lunge, y=PL.y; PL.dead=true;
  G.flash=1; G.shake=1; G.boomT=0; G.boomX=x; G.boomY=y;
  ['wing','tail','wheel','prop','body','body','goggle'].forEach(k=>spawn({type:'part',kind:k,
    x:x+rnd(-20,20),y:y+rnd(-20,20),vx:rnd(-380,380)*S,vy:-rnd(250,650)*S,g:900*S,life:2.2,
    size:rnd(26,42)*Math.max(.7,S),rot:rnd(0,6),vr:rnd(-14,14)}));
  for(let i=0;i<34;i++){
    const a=rnd(0,7),sp=rnd(80,420)*S;
    spawn({type:'puff',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,drag:2.2,life:rnd(.5,1.2),size:rnd(12,26)*S,color:pick(['#ff9f1c','#ffd23f','#ff5d6c','#fff3b0'])});
  }
  for(let i=0;i<14;i++) spawn({type:'puff',x:x+rnd(-30,30),y:y+rnd(-20,20),vx:rnd(-60,60),vy:-rnd(30,120),drag:.6,life:rnd(1.2,2),size:rnd(14,26)*S,color:'#6b6f8d'});
  for(let i=0;i<16;i++) spawn({type:'star',x,y,vx:rnd(-300,300)*S,vy:-rnd(100,450)*S,g:700*S,life:1.4,size:rnd(8,15)*Math.max(.7,S),color:pick(['#ffc93c','#ffffff','#ff8fab','#4cc9f0']),rot:rnd(0,6),vr:rnd(-8,8)});
  G.pilot={x,y,vx:rnd(-40,40)*S,vy:-380*S,t:0};
  sfx.boom();
}
function drawBoom(){
  if(G.boomT<0) return;
  const t=G.boomT; if(t>1.35){G.boomT=-1;return;}
  const sc=t<.18?t/.18*1.3:t<.3?1.3-(t-.18)/.12*.3:1, al=t>.9?1-(t-.9)/.45:1;
  ctx.save(); ctx.globalAlpha=clamp(al,0,1); ctx.translate(G.boomX,G.boomY-18*S);
  const R=120*Math.max(.7,S)*sc;
  ctx.lineJoin='round'; ctx.lineWidth=6; ctx.strokeStyle=INK;
  ctx.fillStyle='#ffc93c'; spiky(0,0,R,R*.62,14,.2); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#ff5d6c'; spiky(0,0,R*.68,R*.42,14,.2); ctx.fill();
  ctx.rotate(-.12); ctx.font=`800 ${Math.round(R*.5)}px ${FONT}`; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.lineWidth=R*.1; ctx.strokeStyle=INK; ctx.strokeText('BOOM!',0,0); ctx.fillStyle='#fff'; ctx.fillText('BOOM!',0,0);
  ctx.restore();
}
function updatePilot(dt){
  const p=G.pilot; if(!p) return;
  p.t+=dt;
  if(p.t<.5) p.vy+=900*S*dt;
  else{p.vy+=(110*S-p.vy)*Math.min(1,dt*3); p.vx+=(Math.sin(p.t*3)*30*S-p.vx)*Math.min(1,dt*2);}
  p.x+=p.vx*dt; p.y+=p.vy*dt;
  if(p.y>H+140) G.pilot=null;
}
function drawPilot(){
  const p=G.pilot; if(!p) return;
  const u=Math.max(.75,S*1.1), open=clamp((p.t-.45)*4,0,1);
  ctx.save(); ctx.translate(p.x,p.y); ctx.scale(u,u);
  ctx.lineJoin='round'; ctx.lineCap='round'; ctx.strokeStyle=INK; ctx.lineWidth=4;
  if(open>0){
    ctx.save(); ctx.translate(0,-70); ctx.scale(open,open);
    ctx.beginPath(); ctx.moveTo(-46,0); ctx.lineTo(-4,70); ctx.moveTo(46,0); ctx.lineTo(4,70); ctx.moveTo(0,0); ctx.lineTo(0,70); ctx.lineWidth=2.5; ctx.stroke(); ctx.lineWidth=4;
    ctx.fillStyle='#ff5d6c'; ctx.beginPath(); ctx.ellipse(0,0,46,34,0,Math.PI,Math.PI*2); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.ellipse(0,0,16,34,0,Math.PI,Math.PI*2); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  ctx.fillStyle='#4cc9f0'; ctx.beginPath(); ctx.ellipse(0,28,12,16,0,0,7); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-6,40); ctx.lineTo(-9+Math.sin(clock*6)*3,56); ctx.moveTo(6,40); ctx.lineTo(9-Math.sin(clock*6)*3,56); ctx.stroke();
  ctx.fillStyle='#ffd9b3'; ctx.beginPath(); ctx.arc(0,0,16,0,7); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#8a4b2a'; ctx.beginPath(); ctx.arc(0,0,16,Math.PI,Math.PI*2); ctx.closePath(); ctx.fill(); ctx.stroke();
  face('dizzy',clock,0,3);
  ctx.fillStyle='#ffc93c'; ctx.lineWidth=2;
  for(let k=0;k<3;k++){const a=clock*6+k*2.1; star5(Math.cos(a)*26,-24+Math.sin(a)*6,6,2.6,a); ctx.fill(); ctx.stroke();}
  if(p.t>.6){
    ctx.save(); ctx.translate(30,-34); ctx.lineWidth=3; ctx.fillStyle='#fff';
    rrect(0,-18,64,32,12); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(8,13); ctx.lineTo(0,24); ctx.lineTo(20,13); ctx.fill(); ctx.stroke();
    ctx.fillStyle=INK; ctx.font=`800 20px ${FONT}`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('Oops!',32,-2);
    ctx.restore();
  }
  ctx.restore();
}
function popCloud(){
  const x=CL.x,y=CL.y;
  for(let i=0;i<26;i++){const a=rnd(0,7),sp=rnd(100,420)*S;
    spawn({type:'puff',x:x+rnd(-CL.w*.3,CL.w*.3),y:y+rnd(-CL.h*.2,CL.h*.2),vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,drag:2.5,life:rnd(.5,.9),size:rnd(14,30)*S,color:'#ffffff'});}
  for(let i=0;i<18;i++){const a=rnd(0,7),sp=rnd(120,460)*S;
    spawn({type:'star',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-80,g:500*S,life:1.1,size:rnd(9,17)*Math.max(.7,S),color:pick(['#ffc93c','#ff8fab','#4cc9f0','#2ec4a6','#fff']),rot:rnd(0,6),vr:rnd(-9,9)});}

/* ===== Cập nhật và vẽ mỗi khung hình ===== */
let exhaustT=0,confT=0;
const ease=x=>1-Math.pow(1-x,3);
function bounce(x){
  const n=7.5625,d=2.75;
  if(x<1/d) return n*x*x; if(x<2/d) return n*(x-=1.5/d)*x+.75;
  if(x<2.5/d) return n*(x-=2.25/d)*x+.9375; return n*(x-=2.625/d)*x+.984375;
}
function update(dt){
  G.t+=dt;
  const target=(G.mode==='approach'||G.mode==='intro'?100*S:0)+G.boost*520*S;
  G.speed+=(target-G.speed)*Math.min(1,dt*4);
  G.boost=Math.max(0,G.boost-dt*1.1);
  scroll+=(30*S+G.speed)*dt;
  PL.prop+=dt*(34+G.boost*30);
  PL.y=CY+Math.sin(clock*2)*8*S+PL.dropY;
  PL.mood=G.mode==='celebrate'||G.mode==='levelDone'?'cheer':(G.mode==='waiting'&&G.tLeft<=3)?'worried':'happy';
  const slide=G.mode==='intro'?1-ease(Math.min(1,G.t/1.2)):0;
  PL.slide=slide;

  switch(G.mode){
    case 'intro': if(G.t>1.9) nextWord(); break;
    case 'approach':{
      const d=CL.x-targetX, step=Math.max(70*S,d*2.4)*dt;
      CL.x=Math.max(targetX,CL.x-step); CL.y=CY;
      if(CL.x<=targetX) arrive();
      break;}
    case 'waiting':
      CL.y=CY; G.tLeft-=dt; setTimerUI(Math.max(0,G.tLeft),G.tMax);
      if(G.tLeft<=5&&Math.ceil(G.tLeft)!==G.tickAt&&G.tLeft>0){G.tickAt=Math.ceil(G.tLeft);sfx.tick();}
      if(G.tLeft<=0) timeout();
      break;
    case 'celebrate':{
      const p=Math.min(1,G.t/1);
      PL.rot=-p*Math.PI*2; PL.lunge=Math.sin(p*Math.PI)*W*.1;
      if(G.t>1.35){PL.rot=0;PL.lunge=0;G.idx++;nextWord();}
      break;}
    case 'exploding':
      if(G.t>2.3){
        if(G.lives<=0) gameOver(); else{G.mode='respawn';G.t=0;PL.dead=false;PL.dropY=-(CY+160);G.pilot=null;}
      }
      break;
    case 'respawn':{
      const p=Math.min(1,G.t/.8); PL.dropY=-(1-bounce(p))*(CY+160);
      if(G.t>.9){PL.dropY=0;G.mode='waiting';G.t=0;G.tLeft=G.tMax;G.tickAt=99;startRec();setHeard('🎤 Thử lại nào! Đọc to từ trên đám mây!');}
      break;}
    case 'levelDone':
      confT-=dt; if(confT<=0){confT=.05;spawn({type:'conf',x:rnd(0,W),y:-10,vx:rnd(-40,40),vy:rnd(80,180),g:60,life:rnd(3,5),size:rnd(9,15),color:pick(['#ffc93c','#ff5d6c','#4cc9f0','#2ec4a6','#fff','#ff8fab']),rot:rnd(0,6),vr:rnd(-6,6)});}
      levelDoneTick();
      break;
  }
  if(!PL.dead&&PL.vis){
    exhaustT-=dt;
    if(exhaustT<=0){exhaustT=.08;spawn({type:'puff',x:PL.x-90*PL.sc*1.1-PL.slide*(PL.x+200),y:PL.y+4*PL.sc,vx:-60*S-G.speed*.3,vy:rnd(-8,8),life:.55,size:6*Math.max(.7,S),color:'#ffffff'});}
  }
  if(G.boomT>=0) G.boomT+=dt;
  G.flash=Math.max(0,G.flash-dt*2.2); G.shake=Math.max(0,G.shake-dt*1.4);
  G.dim+=(G.dimT-G.dim)*Math.min(1,dt*3);
  updatePilot(dt); updateParticles(dt); updateFireworks(dt);
}
function render(dt){
  ctx.setTransform(DPR,0,0,DPR,0,0); ctx.clearRect(0,0,W,H);
  ctx.save();
  if(G.shake>0) ctx.translate(rnd(-1,1)*G.shake*16*S,rnd(-1,1)*G.shake*16*S);
  drawSky(); drawSun(); drawRainbow(); drawHills(); drawScenery(dt);
  if(CL.on) drawCloud(clock);
  if(!PL.dead&&PL.vis) drawPlane(PL.x+PL.lunge-PL.slide*(PL.x+200),PL.y,PL.sc,PL.rot,clock,PL.mood,PL.prop);
  drawPilot(); drawParticles(false); drawBoom();
  ctx.restore();
  if(G.dim>.01){ctx.fillStyle=`rgba(15,15,70,${G.dim})`;ctx.fillRect(0,0,W,H);}
  drawParticles(true); ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
  if(G.flash>.01){ctx.fillStyle=`rgba(255,255,255,${Math.min(1,G.flash*.9)})`;ctx.fillRect(0,0,W,H);}
}
let last=0;
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,Math.max(0,(ts-last)/1000)||0); last=ts; clock+=dt;
  update(dt); render(dt);
}

/* ===== Luồng chơi ===== */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function setHeard(t){$('heard').textContent=t;}

}

function nextLevelIdx(i){for(let j=i+1;j<10;j++) if(cfg.levels[j].words.length) return j;return -1;}
function firstLevelIdx(){for(let j=0;j<10;j++) if(cfg.levels[j].words.length) return j;return -1;}

function startLevel(i){

}
function unlockTTS(){
  try{if('speechSynthesis' in window){const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u);}}catch(e){}
}

/* ===== Nút bấm ===== */
$('bPlay').onclick=()=>{initAudio();unlockTTS();startLevel(parseInt($('startLevel').value,10));};
$('bSound').onclick=()=>{
  soundOn=!soundOn; cfg.sound=soundOn; saveCfg(); $('bSound').textContent=soundOn?'🔊':'🔇';
  if(!soundOn){try{speechSynthesis.cancel();}catch(e){}}
};
$('bHome').onclick=goMenu;
$('bNext').onclick=goNext;
$('bListen').onclick=()=>{if(CL.on) say(CL.word,{rate:.8,pitch:1.1});};
$('bOk').onclick=()=>{if(G.mode==='waiting') correct();};
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&G.mode==='waiting'&&!$('bOk').hidden) correct();
});

/* ===== Màn hình cài đặt: từ vựng, hình minh họa, thời gian cho từng Level ===== */
let draft=null,curTab=0,resetArm=0;
const clone=o=>JSON.parse(JSON.stringify(o));
function setThumb(div,val){
  div.textContent='';
  if(val&&isImgSrc(val)){const im=document.createElement('img');im.src=val;im.alt='';div.appendChild(im);}
  else div.textContent=val||'⭐';
}
function resizeImage(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader(); fr.onerror=rej;
    fr.onload=()=>{
      const im=new Image(); im.onerror=rej;
      im.onload=()=>{
        const k=Math.min(1,160/Math.max(im.width,im.height)),c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(im.width*k)); c.height=Math.max(1,Math.round(im.height*k));
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        res(c.toDataURL('image/webp',.85));
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function makeRow(word){
  const row=document.createElement('div'); row.className='row'; row._img=word.img||'';
  const iw=document.createElement('input'); iw.type='text'; iw.className='in-w'; iw.maxLength=40;
  iw.placeholder='Từ tiếng Anh'; iw.value=word.w||''; iw.autocapitalize='off'; iw.spellcheck=false; iw.autocomplete='off';
  const ii=document.createElement('input'); ii.type='text'; ii.className='in-img';
  const isData=/^data:/i.test(row._img);
  ii.placeholder=isData?'Đang dùng ảnh tải lên':'Emoji hoặc link ảnh'; ii.value=isData?'':row._img; ii.autocomplete='off';
  const th=document.createElement('div'); th.className='thumb'; setThumb(th,row._img);
  ii.addEventListener('input',()=>{row._img=ii.value.trim();setThumb(th,row._img);});
  const up=document.createElement('label'); up.className='upl'; up.textContent='📷 Tải ảnh';
  const fi=document.createElement('input'); fi.type='file'; fi.accept='image/*'; fi.hidden=true; up.appendChild(fi);
  fi.onchange=()=>{
    const f=fi.files&&fi.files[0]; if(!f) return;
    resizeImage(f).then(u=>{row._img=u;ii.value='';ii.placeholder='Đang dùng ảnh tải lên';setThumb(th,u);$('sMsg').textContent='';})
      .catch(()=>{$('sMsg').textContent='Không đọc được ảnh này, hãy thử ảnh khác.';});
    fi.value='';
  };
  const x=document.createElement('button'); x.type='button'; x.className='x'; x.textContent='✕'; x.title='Xóa từ này';
  x.onclick=()=>row.remove();
  row.append(iw,ii,th,up,x); return row;
}
function renderTabs(){
  const t=$('tabs'); t.textContent='';
  draft.levels.forEach((L,i)=>{
    const b=document.createElement('button'); b.type='button';
    b.className='tab'+(i===curTab?' on':'')+(!L.words.some(w=>w.w.trim())?' empty':'');
    b.textContent='Level '+(i+1);
    b.onclick=()=>{syncDraft();curTab=i;renderTabs();renderLevel();};
    t.appendChild(b);
  });
}
function renderLevel(){
  const L=draft.levels[curTab];
  $('lName').value=L.name; $('lTime').value=L.time;
  const rows=$('rows'); rows.textContent='';
  L.words.forEach(w=>rows.appendChild(makeRow(w)));
  if(!L.words.length) rows.appendChild(makeRow({w:'',img:''}));
}
function syncDraft(){
  const L=draft.levels[curTab];
  L.name=$('lName').value.trim(); L.time=Number($('lTime').value)||15;
  L.words=[...$('rows').children].map(r=>({w:r.querySelector('.in-w').value.trim(),img:r._img||''}));
}
function collect(){
  syncDraft(); draft.sound=$('sSound').checked; draft.confirm=$('sConfirm').checked; draft.strict=$('sStrict').value;
  return sanitize(draft);
}
function openSettings(){
  draft=clone(cfg); curTab=Math.max(0,parseInt($('startLevel').value,10)||0);
  $('sSound').checked=draft.sound; $('sConfirm').checked=draft.confirm; $('sStrict').value=draft.strict;
  $('sMsg').textContent=''; $('bReset').textContent='↺ Khôi phục mặc định';
  renderTabs(); renderLevel(); $('settings').classList.add('show');
}
$('bSettings').onclick=openSettings;
$('bCancel').onclick=()=>$('settings').classList.remove('show');
$('bAdd').onclick=()=>{
  if($('rows').children.length>=30){$('sMsg').textContent='Mỗi Level tối đa 30 từ.';return;}
  const r=makeRow({w:'',img:''}); $('rows').appendChild(r); r.querySelector('.in-w').focus();
};
$('bSave').onclick=()=>{
  cfg=collect(); soundOn=cfg.sound; $('bSound').textContent=soundOn?'🔊':'🔇';
  const ok=saveCfg(); refreshMenu(); updateMicUI();
  if(ok) $('settings').classList.remove('show');
  else $('sMsg').textContent='Đã áp dụng nhưng chưa lưu được vào trình duyệt (ảnh tải lên quá nặng?). Hãy dùng emoji, link ảnh hoặc ảnh nhỏ hơn.';
};
$('bExport').onclick=()=>{
  const blob=new Blob([JSON.stringify(collect(),null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='phicongnhi-cai-dat.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
};
$('bImport').onclick=()=>$('fImport').click();
$('fImport').onchange=()=>{
  const f=$('fImport').files&&$('fImport').files[0]; if(!f) return;
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      draft=sanitize(JSON.parse(fr.result)); curTab=0;
      $('sSound').checked=draft.sound; $('sConfirm').checked=draft.confirm; $('sStrict').value=draft.strict;
      renderTabs(); renderLevel(); $('sMsg').textContent='Đã nhập file. Bấm "Lưu và đóng" để áp dụng.';
    }catch(e){$('sMsg').textContent='File không đúng định dạng.';}
  };
  fr.readAsText(f); $('fImport').value='';
};
$('bReset').onclick=()=>{
  const b=$('bReset');
  if(Date.now()-resetArm>3500){resetArm=Date.now();b.textContent='Bấm lần nữa để xác nhận';return;}
  resetArm=0; b.textContent='↺ Khôi phục mặc định';
  draft=defaults(); curTab=0;
  $('sSound').checked=draft.sound; $('sConfirm').checked=draft.confirm; $('sStrict').value=draft.strict;
  renderTabs(); renderLevel(); $('sMsg').textContent='Đã khôi phục. Bấm "Lưu và đóng" để áp dụng.';
};

/* ===== Khởi động ===== */
PL.slide=0; PL.vis=true;
try{if(document.fonts&&document.fonts.load) document.fonts.load('800 40px "Baloo 2"');}catch(e){}
layout(); sceneInit(); refreshMenu();
addEventListener('resize',()=>{layout();});
requestAnimationFrame(frame);
window.__game={G,PL,CL,startLevel,correct,timeout,levelComplete,isCorrect,goMenu,getCfg:()=>cfg,hearts:renderHearts};
})();

</script>
